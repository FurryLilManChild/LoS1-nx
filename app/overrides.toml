# Code the automatic function discovery misses. Every entry carries its evidence.

# The C runtime's setjmp/longjmp (root keys: they must stay outside any table). The game embeds Lua 5.1 ("Lua script
# subsystem initialized", LuaInterface\Functions.cpp), which reports script errors with longjmp back to the setjmp of
# its protected call; recompiled as plain calls, longjmp returns and Lua panics (mof-nx's third boot: exit(1) from
# luaD_throw). Found 2026-10-26 by Mirror of Fate's copies (mof-nx overrides.toml):
#   setjmp  0x826F0A00: lis r4; lwz r0; cmpwi r0,0; mtctr; bnectr; mflr r0; mfcr r4; stfd f14,0(r3).. (Mirror of
#           Fate's 0x82920D60 word for word but the lis/lwz address); 8 callers, those found check r3 against 0
#   longjmp 0x826F0CD0: Mirror of Fate's 0x82609460 word for word for its first 12 words (lwz r0,0x138(r3) at +20);
#           19 callers
setjmp_address = 0x826F0A00
longjmp_address = 0x826F0CD0

[functions]
