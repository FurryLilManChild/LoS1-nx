# Apple Silicon defaults. Copied next to the executable once; edit that copy.
license_mask = 1
gpu_plugin = "xenos"
# Direct3D-level rendering through Vulkan/MoltenVK. The Xenos plugin remains
# available as a fallback: set sa2_renderer = "xenos" and restart.
sa2_renderer = "renut"
log_level = "info"
audio_mute = true
