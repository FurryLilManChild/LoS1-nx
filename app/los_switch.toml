# Castlevania: Lords of Shadow settings, read at start.

# true: a frame that misses its refresh is shown as soon as it is ready instead of waiting for the next one.
sa2_vsync_relaxed = true

# Face buttons by position, as on an Xbox pad (bottom = A). false = by letter.
input_xbox_layout = true

# The port menu (- and + together) sets the three keys below and saves them here.

# Shadows: "full" (the game's own), "world" (the world casts shadows, characters do not; faster), "off" (fastest).
los_shadows = "full"

# Handheld render resolution: "auto" (960x540 when the console runs at its stock clocks, 1280x720 when overclocked;
# checked every 5 seconds, so changing a sys-clk profile while playing switches it), "540" or "720".
los_handheld_resolution = "auto"

# Frame rate cap in handheld mode: -1 = 30 fps at the stock clocks (auto), 0 = no cap, 30 = always 30 fps.
los_fps_cap = -1
